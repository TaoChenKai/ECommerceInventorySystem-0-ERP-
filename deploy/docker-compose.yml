version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: inventory-db
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory123}
      POSTGRES_DB: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # 仅供本机访问，避免端口暴露到外网
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ../backend
    container_name: inventory-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://inventory:${POSTGRES_PASSWORD:-inventory123}@db:5432/inventory
      SECRET_KEY: ${SECRET_KEY:-please-change-me-in-production}
      BOSS_USERNAME: ${BOSS_USERNAME:-boss}
      BOSS_PASSWORD: ${BOSS_PASSWORD:-admin123}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ../frontend
    container_name: inventory-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  pgdata:
